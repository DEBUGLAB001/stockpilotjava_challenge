# Server configuration (supports command-line or environment override)
server.port=${PORT:8080}
server.address=0.0.0.0

# Lightweight In-memory H2 Database configuration
spring.datasource.url=jdbc:h2:mem:stockpilotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (available for inspection if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fast startup optimizations
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.org.springframework.test.web.servlet=ERROR
logging.level.com.stockpilot=INFO
